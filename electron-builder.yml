appId: app.craftpages
productName: CraftPages
copyright: Copyright © 2026 Vitalii Kiiko
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig,dev-app-update.yml,CHANGELOG.md,README.md,CONTRIBUTING.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.github,scripts,docs,wiki}/*'
  # sharp's WebAssembly fallback (8.8 MB), installed on every platform but used only where no
  # native binary exists; each build ships its native one.
  - '!**/node_modules/@img/sharp-wasm32/**'
asarUnpack:
  - resources/**
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
# Chromium's own translations (menus, dialogs): only the app's languages. The other ~50
# were 45 MB of the Mac app. "en" keeps en-US, en-GB and the rest.
electronLanguages: [en, it, uk]
# Mac: each app keeps only its own CPU's sharp binary (scripts/mac-sharp.mjs installs both).
# build:linux replaces this hook for the AppImage (-c.afterPack); elsewhere it does nothing.
afterPack: scripts/after-pack.mjs
# Installer names carry no version (CraftPages-arm64.dmg), so
# github.com/moomoo-agency/craftpages/releases/latest/download/<name> always gets the newest.
artifactName: ${productName}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: CraftPages opens the site folders you choose, which may be in Documents.
    - NSDownloadsFolderUsageDescription: CraftPages opens the site folders you choose, which may be in Downloads.
  # Signed with the Developer ID certificate and notarized by Apple in the Release workflow
  # (CSC_LINK, APPLE_ID, … secrets); see wiki/Building-from-source.md → "Signing".
  notarize: true

win:
  executableName: CraftPages
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

linux:
  executableName: craftpages
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: Vitalii Kiiko
  category: Development
  synopsis: Desktop CMS for plain-HTML static sites
deb:
  artifactName: ${name}_${arch}.${ext}

npmRebuild: false
# Where the app looks for updates (electron-updater). The builds write latest*.yml for it;
# uploading is left to the GitHub workflow (--publish never in the build scripts).
publish:
  provider: github
  owner: moomoo-agency
  repo: craftpages
