# Builds CraftPages on macOS, Windows and Linux and attaches the installers to a published
# GitHub release. Run it by pushing a version tag (git tag v1.0.0 && git push --tags)
# or by hand from the Actions tab (then the files are only kept as workflow artifacts).
#
# Each OS builds on its own runner because sharp, the image library, ships a native
# binary per platform: an app packaged on one OS can't process images on another.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # The macOS arm64 runners have ~7 GB of RAM, so Node's default heap is small and
      # electron-vite build aborts with exit code 134 (heap out of memory).
      - run: npm run ${{ matrix.script }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Developer ID signing and notarization, Mac only: on Windows electron-builder
          # would try to sign the installer with CSC_LINK too.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}

      # electron-builder only warns when it finds no certificate and ships an unsigned app;
      # stop here instead, so an app macOS calls "damaged" is never released.
      - name: Check the Mac apps are signed and notarized
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac-arm64/CraftPages.app dist/mac/CraftPages.app; do
            # -dvv: plain -dv doesn't print the Authority (certificate chain) lines.
            info=$(codesign -dvv "$app" 2>&1)
            echo "$app: $(grep -m1 '^Authority=' <<<"$info" || echo 'no signing authority')"
            grep -q '^Authority=Developer ID Application' <<<"$info" \
              || { echo "::error::$app is not signed with a Developer ID certificate"; exit 1; }
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: craftpages-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*
